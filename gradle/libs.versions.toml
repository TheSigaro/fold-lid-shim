[versions]
agp = "8.9.2"
hiddenapibypass = "6.1"
junit = "4.13.2"
kotlin = "2.1.21"
shizuku = "13.1.5"

[libraries]
bouncycastle = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.80" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version = "2.5.3" }
boringssl = { module = "io.github.vvb2060.ndk:boringssl", version = "20250114" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
hiddenapibypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenapibypass" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
